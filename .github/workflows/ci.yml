name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # pnpm 11 需要 Node >= 22.13（依赖内置 node:sqlite）
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 必须显式指定官方 registry：本地/镜像 registry（npmmirror）没有实现 audit 端点
      # 阈值 high：中危由 Dependabot 提示，高危/严重直接挡 CI
      # --ignore-registry-errors：registry 故障时不误判为漏洞
      - run: pnpm audit --registry=https://registry.npmjs.org/ --audit-level=high --ignore-registry-errors
      - run: pnpm typecheck
      - run: pnpm typecheck:e2e
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # pnpm 11 需要 Node >= 22.13（依赖内置 node:sqlite）
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
